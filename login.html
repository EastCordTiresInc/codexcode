<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log In | EastCord Tires</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="appointment.css?v=4" />
    <link rel="stylesheet" href="account.css?v=3" />
  </head>
  <body class="account-page">
    <header class="site-header">
      <div class="nav-shell">
        <a class="brand brand-logo" href="/" aria-label="EastCord Tires home">
          <img src="assets/eastcord-logo-red-black.svg" alt="EastCord Tires" />
        </a>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="/">Home</a>
          <a href="/appointment.html">Appointment</a>
          <span class="auth-nav-group" data-auth-logged-out>
            <a href="/signup.html">Sign Up</a>
            <a href="/login.html">Log In</a>
            <a href="/cart.html">Cart<span data-cart-count></span></a>
          </span>
          <span class="auth-nav-group" data-auth-logged-in hidden>
            <a href="/account.html">My Account</a>
            <a href="/cart.html">Cart<span data-cart-count></span></a>
            <button class="auth-link-button" type="button" data-logout-button>Log Out</button>
          </span>
        </nav>
      </div>
    </header>

    <main class="section">
      <div class="shell">
        <section class="account-card" aria-labelledby="login-title">
          <h1 id="login-title">Log In</h1>
          <p>Log in before checkout so your appointment and payment record can connect to your customer profile.</p>
          <form class="account-form" data-login-form>
            <label class="form-field">
              <span>Email</span>
              <input name="Email" type="email" autocomplete="email" required />
            </label>
            <label class="form-field">
              <span>Password</span>
              <span class="password-input-wrap">
                <input id="login-password" name="Password" type="password" autocomplete="current-password" required />
                <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false" aria-controls="login-password" data-password-toggle>
                  <svg class="password-icon password-icon-show" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                  <svg class="password-icon password-icon-hide" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 3l18 18" />
                    <path d="M10.6 10.6A2 2 0 0 0 12 14a2 2 0 0 0 1.4-.6" />
                    <path d="M9.9 5.2A10.9 10.9 0 0 1 12 5c6 0 9.5 7 9.5 7a17 17 0 0 1-3.1 4.1" />
                    <path d="M6.6 6.9C3.9 8.7 2.5 12 2.5 12s3.5 7 9.5 7a10.7 10.7 0 0 0 4.2-.9" />
                  </svg>
                </button>
              </span>
            </label>
            <p class="account-message" data-auth-message></p>
            <div class="account-actions">
              <button class="button button-primary" type="submit">Log In</button>
              <a href="/signup.html">Don’t have an account? Sign up</a>
            </div>
          </form>
        </section>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth-config.js"></script>
    <script src="account.js?v=19"></script>
    <script>
      (() => {
        function initializePasswordToggles() {
          document.querySelectorAll('[data-password-toggle]').forEach((button) => {
            const input = document.getElementById(button.getAttribute('aria-controls'));
            if (!input) return;

            button.addEventListener('click', () => {
              const shouldShow = input.type === 'password';
              input.type = shouldShow ? 'text' : 'password';
              button.setAttribute('aria-label', shouldShow ? 'Hide password' : 'Show password');
              button.setAttribute('aria-pressed', String(shouldShow));
              button.classList.toggle('is-showing', shouldShow);
            });
          });
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', initializePasswordToggles, { once: true });
        } else {
          initializePasswordToggles();
        }
      })();
    </script>
    <script src="mobile-menu.js?v=1" defer></script>
  </body>
</html>
