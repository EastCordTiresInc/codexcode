<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="EastCord Tires has received your request." />
    <title>Request Received | EastCord Tires</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="heading-balance.css" />
    <link rel="stylesheet" href="footer-section.css?v=3" />
    <link rel="stylesheet" href="chat.css" />
    <style>
      .thank-you-page {
        min-height: 100vh;
        background:
          radial-gradient(circle at 10% 0%, rgba(223, 31, 45, 0.08), transparent 34%),
          linear-gradient(rgba(15, 23, 42, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(15, 23, 42, 0.06) 1px, transparent 1px),
          #ffffff;
        background-size: auto, 72px 72px, 72px 72px, auto;
      }

      .thank-you-card {
        max-width: 820px;
        margin: 0 auto;
        padding: clamp(34px, 6vw, 64px);
        border: 1px solid rgba(15, 23, 42, 0.1);
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 28px 70px rgba(15, 23, 42, 0.12);
        text-align: center;
      }

      .thank-you-card h1 {
        margin: 0 0 18px;
        color: #111317;
        font-size: clamp(2.25rem, 5vw, 4rem);
        line-height: 1.02;
      }

      .thank-you-card p {
        margin: 0 auto 26px;
        max-width: 620px;
        color: #4f5663;
        font-size: 1.05rem;
        line-height: 1.7;
      }
    </style>
  </head>
  <body class="thank-you-page">
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header class="site-header">
      <div class="nav-shell">
        <a class="brand brand-logo" href="/" aria-label="EastCord Tires home">
          <img src="assets/eastcord-logo-red-black.svg" alt="EastCord Tires" />
        </a>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="/">Home</a>
          <a href="/appointment.html">Appointment</a>
          <a href="/#contact">Contact</a>
        </nav>
      </div>
    </header>

    <main id="main-content">
      <section class="section">
        <div class="shell">
          <div class="thank-you-card">
            <h1>Request Received</h1>
            <p>
              Thank you for contacting EastCord Tires. We received your appointment request and will follow up to confirm availability, service details, and payment next steps.
            </p>
            <a class="button button-primary" href="/">Back to Home</a>
          </div>
        </div>
      </section>
    </main>

    <script src="chat.js?v=2" defer></script>
  </body>
</html>
