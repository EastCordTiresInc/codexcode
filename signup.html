<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign Up | EastCord Tires</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="appointment.css?v=4" />
    <link rel="stylesheet" href="account.css" />
  </head>
  <body class="account-page">
    <header class="site-header">
      <div class="nav-shell">
        <a class="brand brand-logo" href="/" aria-label="EastCord Tires home">
          <img src="assets/eastcord-logo-red-black.svg" alt="EastCord Tires" />
        </a>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="/">Home</a>
          <a href="/appointment.html">Appointment</a>
          <span class="auth-nav-group" data-auth-logged-out>
            <a href="/signup.html">Sign Up</a>
            <a href="/login.html">Log In</a>
            <a href="/cart.html">Cart<span data-cart-count></span></a>
          </span>
          <span class="auth-nav-group" data-auth-logged-in hidden>
            <a href="/account.html">My Account</a>
            <a href="/cart.html">Cart<span data-cart-count></span></a>
            <button class="auth-link-button" type="button" data-logout-button>Log Out</button>
          </span>
        </nav>
      </div>
    </header>

    <main class="section">
      <div class="shell">
        <section class="account-card" aria-labelledby="signup-title">
          <h1 id="signup-title">Create Your Account</h1>
          <p>Create an EastCord Tires customer account before checkout. Passwords are handled by the configured auth provider and are not stored manually on this website.</p>
          <form class="account-form" data-signup-form>
            <div class="account-form-grid">
              <label class="form-field">
                <span>Full name</span>
                <input name="Full Name" type="text" autocomplete="name" required />
              </label>
              <label class="form-field">
                <span>Phone</span>
                <input name="Phone" type="tel" autocomplete="tel" required />
              </label>
              <label class="form-field">
                <span>Email</span>
                <input name="Email" type="email" autocomplete="email" required />
              </label>
              <label class="form-field">
                <span>Password</span>
                <input name="Password" type="password" autocomplete="new-password" minlength="8" required />
              </label>
              <label class="form-field">
                <span>Confirm password</span>
                <input name="Confirm Password" type="password" autocomplete="new-password" minlength="8" required />
              </label>
            </div>
            <p class="account-message" data-auth-message></p>
            <div class="account-actions">
              <button class="button button-primary" type="submit">Sign Up</button>
              <a href="/login.html">Already have an account? Log in</a>
            </div>
          </form>
        </section>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth-config.js"></script>
    <script src="account.js?v=3"></script>
  </body>
</html>
