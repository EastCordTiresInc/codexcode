<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Thank You | EastCord Tires</title>
    <link rel="stylesheet" href="styles.css?v=7" />
    <link rel="stylesheet" href="tire-cart.css?v=9" />
    <link rel="stylesheet" href="demo-payment.css?v=1" />
    <link rel="stylesheet" href="/footer-section.css?v=5" />
  </head>
  <body class="tire-cart-page demo-payment-page">
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header class="site-header">
      <div class="nav-shell">
        <a class="brand brand-logo" href="/" aria-label="EastCord Tires home">
          <img src="/assets/eastcord-logo-red-black.svg" alt="EastCord Tires" />
        </a>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="/">Home</a>
          <div class="nav-dropdown">
            <button class="nav-dropdown-toggle" type="button" aria-expanded="false" aria-haspopup="true">Tires</button>
            <div class="nav-dropdown-menu">
              <a href="/used-tires">Used Tires</a>
              <a href="/new-tires">New Tires</a>
            </div>
          </div>
          <a href="/appointment">Appointment</a>
          <a href="/local-installers">Local Installers</a>
          <a href="/#contact">Contact</a>
          <span class="nav-carts" aria-label="Shopping carts">
            <a href="/tire-cart">Tire Cart<span data-tire-cart-count></span></a>
            <a href="/cart">Appointment Cart<span data-appointment-cart-count></span></a>
          </span>
        </nav>
      </div>
    </header>

    <main class="section" id="main-content">
      <div class="shell tire-cart-layout">
        <section class="tire-cart-panel">
          <p class="tire-cart-eyebrow">Used tire order</p>
          <h1>Thank you for your payment</h1>
          <p data-demo-thanks>Your demo payment was received. No real card was charged.</p>
          <p data-demo-email-status></p>
          <div class="demo-receipt" data-demo-receipt></div>
          <p class="tire-cart-message" data-demo-sheet-status></p>
          <div class="tire-cart-actions">
            <a class="button button-primary" href="/used-tires">Return to Used Tires</a>
            <button class="button button-secondary" type="button" data-demo-restore>Restore stock</button>
            <a class="button button-secondary" href="/demo-payment">Run another demo</a>
          </div>
        </section>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth-config.js?v=3"></script>
    <script src="account.js?v=30"></script>
    <script src="demo-payment-success.js?v=1"></script>
    <script src="mobile-menu.js?v=2" defer></script>
  </body>
</html>
